<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Solo Lab Mobiles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 20px;
        }

        .login-box {
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-area img {
            width: 80px;
            height: auto;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 15px;
            color: #64748b;
            margin-bottom: 30px;
            font-weight: normal;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }

        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .hint {
            margin-top: 16px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
  

</head>
<body>
    <div class="login-box">
        <div class="logo-area">
            <img src="shop-logo.png" alt="Solo Lab Mobiles">
        </div>
        <h1>Solo Lab Mobiles</h1>
        <h2>POS System Login</h2>

        <div class="error" id="errorBox"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required autofocus>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Sign In</button>
        </form>

        <p class="hint">Default: AD / A1</p>
    </div>

    <script>
        // Your credentials — change these anytime!
        const VALID_USER = {
            username: 'admin',
            password: 'admin123'
        };

        // Check if already logged in
        window.onload = function() {
            if (localStorage.getItem('posLoggedIn') === 'true') {
                window.location.href = 'index.html';
            }
        };

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');

            if (username === VALID_USER.username && password === VALID_USER.password) {
                localStorage.setItem('posLoggedIn', 'true');
                window.location.href = 'index.html';
            } else {
                errorBox.style.display = 'block';
                errorBox.textContent = 'Invalid username or password';
            }
        });
    </script>
</body>
</html>
