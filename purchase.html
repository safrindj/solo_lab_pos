<script>
  "use strict";

  const STORAGE_KEY = "soloLabPurchasesReturns";
  const SUPPLIERS = ["Supplier A", "Supplier B", "Supplier C"];

  let purchaseItems = [];
  let records = loadRecords();

  function loadRecords() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return {
        purchases: Array.isArray(saved?.purchases) ? saved.purchases : [],
        returns: Array.isArray(saved?.returns) ? saved.returns : [],
        history: Array.isArray(saved?.history) ? saved.history : []
      };
    } catch {
      return { purchases: [], returns: [], history: [] };
    }
  }

  function saveRecords() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    } catch {
      alert("Your browser could not save these records.");
    }
  }

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatMoney(value) {
    return Number(value).toLocaleString("en-IN", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
  }

  function makeButton(text, className, onClick) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = className;
    button.textContent = text;
    button.addEventListener("click", onClick);
    return button;
  }

  function setEmptyState(tbody, colspan, message) {
    const row = document.createElement("tr");
    const cell = document.createElement("td");
    cell.colSpan = colspan;
    cell.className = "empty-state";
    cell.textContent = message;
    row.appendChild(cell);
    tbody.replaceChildren(row);
  }

  function populateSuppliers() {
    const select = document.getElementById("purchaseSupplier");

    SUPPLIERS.forEach((supplier) => {
      const option = document.createElement("option");
      option.value = supplier;
      option.textContent = supplier;
      select.appendChild(option);
    });
  }

  function setupTabs() {
    const buttons = document.querySelectorAll(".tab-btn");

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        buttons.forEach((tabButton) => {
          const isActive = tabButton === button;
          tabButton.classList.toggle("active", isActive);
          tabButton.setAttribute("aria-selected", String(isActive));
        });

        document.querySelectorAll(".tab-content").forEach((panel) => {
          panel.classList.toggle(
            "active",
            panel.id === `${button.dataset.tab}-tab`
          );
        });
      });
    });
  }

  function openPurchaseModal() {
    const modal = document.getElementById("purchaseModal");
    document.getElementById("purchaseDate").value = today();
    modal.classList.add("active");
    document.getElementById("purchaseSupplier").focus();
  }

  function closePurchaseModal() {
    document.getElementById("purchaseModal").classList.remove("active");
  }

  function renderProductList() {
    const container = document.getElementById("productListContainer");
    container.replaceChildren();

    if (purchaseItems.length === 0) {
      const emptyMessage = document.createElement("div");
      emptyMessage.className = "product-list-empty";
      emptyMessage.textContent =
        'No products added yet. Select a product and click "Add" to build your purchase list.';
      container.appendChild(emptyMessage);
      return;
    }

    purchaseItems.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "purchase-list-item";

      [
        item.name,
        `Qty: ${item.quantity}`,
        `Free: ${item.freeQuantity}`,
        `Unit cost: Rs. ${formatMoney(item.unitCost)}`,
        `Total: Rs. ${formatMoney(item.total)}`
      ].forEach((text) => {
        const cell = document.createElement("span");
        cell.textContent = text;
        row.appendChild(cell);
      });

      row.appendChild(
        makeButton("Remove", "remove-item-btn", () => {
          purchaseItems.splice(index, 1);
          renderProductList();
        })
      );

      container.appendChild(row);
    });
  }

  function addProductToList() {
    const name = document.getElementById("productSearch").value.trim();
    const quantity = Number(document.getElementById("qtyBought").value);
    const freeQuantity = Number(document.getElementById("freeQty").value || 0);
    const unitCost = Number(document.getElementById("unitCost").value);
    const discount = Number(document.getElementById("discount").value || 0);

    if (!name) {
      alert("Enter or select a product.");
      return;
    }

    if (!Number.isInteger(quantity) || quantity < 1) {
      alert("Quantity bought must be a whole number greater than zero.");
      return;
    }

    if (!Number.isInteger(freeQuantity) || freeQuantity < 0) {
      alert("Free quantity must be a non-negative whole number.");
      return;
    }

    if (!Number.isFinite(unitCost) || unitCost < 0) {
      alert("Enter a valid unit cost.");
      return;
    }

    const subtotal = quantity * unitCost;

    if (!Number.isFinite(discount) || discount < 0 || discount > subtotal) {
      alert("Discount must be between zero and the product subtotal.");
      return;
    }

    purchaseItems.push({
      name,
      quantity,
      freeQuantity,
      unitCost,
      discount,
      total: subtotal - discount
    });

    document.getElementById("productSearch").value = "";
    document.getElementById("qtyBought").value = "";
    document.getElementById("freeQty").value = "0";
    document.getElementById("unitCost").value = "";
    document.getElementById("discount").value = "0";

    renderProductList();
    document.getElementById("productSearch").focus();
  }

  function processPurchase() {
    const supplier = document.getElementById("purchaseSupplier").value;
    const date = document.getElementById("purchaseDate").value;

    if (!supplier) {
      alert("Select a supplier.");
      return;
    }

    if (!date) {
      alert("Select a purchase date.");
      return;
    }

    if (purchaseItems.length === 0) {
      alert("Add at least one product before processing the purchase.");
      return;
    }

    const items = purchaseItems.map((item) => ({ ...item }));
    const total = items.reduce((sum, item) => sum + item.total, 0);

    records.purchases.push({
      id: crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`,
      supplier,
      date,
      items,
      total
    });

    saveRecords();
    purchaseItems = [];
    renderProductList();
    closePurchaseModal();
    renderAll();
  }

  function renderPurchases() {
    const tbody = document.getElementById("purchasesBody");

    if (records.purchases.length === 0) {
      setEmptyState(
        tbody,
        4,
        'No purchase records yet. Click "Record Purchase" to add one.'
      );
      return;
    }

    const grouped = new Map();

    records.purchases.forEach((purchase) => {
      const current = grouped.get(purchase.supplier) || {
        supplier: purchase.supplier,
        bills: 0,
        total: 0,
        purchases: []
      };

      current.bills += 1;
      current.total += Number(purchase.total) || 0;
      current.purchases.push(purchase);
      grouped.set(purchase.supplier, current);
    });

    tbody.replaceChildren();

    grouped.forEach((group) => {
      const row = document.createElement("tr");
      const supplierCell = document.createElement("td");
      const billsCell = document.createElement("td");
      const totalCell = document.createElement("td");
      const actionsCell = document.createElement("td");

      supplierCell.textContent = group.supplier;
      billsCell.className = "text-right";
      billsCell.textContent = String(group.bills);
      totalCell.className = "text-right";
      totalCell.textContent = `Rs. ${formatMoney(group.total)}`;
      actionsCell.className = "text-center";

      actionsCell.appendChild(
        makeButton("View", "view-btn", () => {
          const details = group.purchases.map((purchase) => {
            const products = purchase.items
              .map((item) => `${item.name} × ${item.quantity}`)
              .join(", ");
            return `${purchase.date}: ${products} — Rs. ${formatMoney(purchase.total)}`;
          });
          alert(`${group.supplier}\n\n${details.join("\n")}`);
        })
      );

      actionsCell.appendChild(
        makeButton("Delete", "delete-btn", () => {
          if (!confirm(`Delete all purchase records for ${group.supplier}?`)) {
            return;
          }

          records.purchases = records.purchases.filter(
            (purchase) => purchase.supplier !== group.supplier
          );

          records.history.push({
            date: new Date().toLocaleString(),
            type: "Purchase",
            supplier: group.supplier,
            deletedBy: "Current user",
            amount: group.total
          });

          saveRecords();
          renderAll();
        })
      );

      row.append(supplierCell, billsCell, totalCell, actionsCell);
      tbody.appendChild(row);
    });
  }

  function recordReturn() {
    const supplierNumber = prompt(
      `Select supplier by number:\n${SUPPLIERS.map(
        (supplier, index) => `${index + 1}. ${supplier}`
      ).join("\n")}`
    );

    if (supplierNumber === null) return;

    const supplierIndex = Number(supplierNumber) - 1;
    if (!Number.isInteger(supplierIndex) || !SUPPLIERS[supplierIndex]) {
      alert("Select a valid supplier number.");
      return;
    }

    const items = prompt("Describe the items being returned:");
    if (items === null || !items.trim()) return;

    const amountText = prompt("Enter the credit amount in Rs.:");
    if (amountText === null) return;

    const amount = Number(amountText);
    if (!Number.isFinite(amount) || amount <= 0) {
      alert("Enter a valid credit amount greater than zero.");
      return;
    }

    records.returns.push({
      id: crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`,
      supplier: SUPPLIERS[supplierIndex],
      date: today(),
      items: items.trim(),
      amount
    });

    saveRecords();
    renderAll();
  }

  function renderReturns() {
    const tbody = document.getElementById("returnsBody");

    if (records.returns.length === 0) {
      setEmptyState(tbody, 5, "No returns recorded yet.");
      return;
    }

    tbody.replaceChildren();

    records.returns.forEach((record) => {
      const row = document.createElement("tr");
      const supplierCell = document.createElement("td");
      const dateCell = document.createElement("td");
      const itemsCell = document.createElement("td");
      const amountCell = document.createElement("td");
      const actionsCell = document.createElement("td");

      supplierCell.textContent = record.supplier;
      dateCell.textContent = record.date;
      itemsCell.textContent = record.items;
      amountCell.className = "text-right";
      amountCell.textContent = `Rs. ${formatMoney(record.amount)}`;
      actionsCell.className = "text-center";

      actionsCell.appendChild(
        makeButton("Delete", "delete-btn", () => {
          if (!confirm("Delete this return record?")) return;

          records.returns = records.returns.filter(
            (item) => item.id !== record.id
          );
          records.history.push({
            date: new Date().toLocaleString(),
            type: "Vendor return",
            supplier: record.supplier,
            deletedBy: "Current user",
            amount: record.amount
          });

          saveRecords();
          renderAll();
        })
      );

      row.append(supplierCell, dateCell, itemsCell, amountCell, actionsCell);
      tbody.appendChild(row);
    });
  }

  function renderHistory() {
    const tbody = document.getElementById("historyBody");

    if (records.history.length === 0) {
      setEmptyState(tbody, 5, "No deleted records yet.");
      return;
    }

    tbody.replaceChildren();

    [...records.history].reverse().forEach((record) => {
      const row = document.createElement("tr");

      [
        record.date,
        record.type,
        record.supplier,
        record.deletedBy,
        `Rs. ${formatMoney(record.amount)}`
      ].forEach((text, index) => {
        const cell = document.createElement("td");
        cell.textContent = text;
        if (index === 4) cell.className = "text-right";
        row.appendChild(cell);
      });

      tbody.appendChild(row);
    });
  }

  function renderAll() {
    renderPurchases();
    renderReturns();
    renderHistory();
  }

  document.addEventListener("DOMContentLoaded", () => {
    populateSuppliers();
    setupTabs();
    renderProductList();
    renderAll();

    document.getElementById("purchaseModal").addEventListener("click", (event) => {
      if (event.target.id === "purchaseModal") {
        closePurchaseModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (
        event.key === "Escape" &&
        document.getElementById("purchaseModal").classList.contains("active")
      ) {
        closePurchaseModal();
      }
    });
  });
</script>
