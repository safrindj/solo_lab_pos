  <script>
// ==========================================
// Google Sheets Sync — SOLO LAB MOBILES
// ==========================================
const GS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwdVCmtSvSo5deT_5Os6yXRp1EE7hroItOe6ufemZe-rgH-yzsM9xq02bLqWsSUjBPw/exec"; // ← PASTE YOUR URL HERE

async function gsRead(tabName) {
  try {
    const res = await fetch(`${GS_WEB_APP_URL}?action=read&tab=${tabName}`);
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    
    // Convert sheet rows to objects (first row = headers)
    const rows = json.data;
    if (rows.length < 2) return [];
    
    const headers = rows[0].map(h => h.trim());
    return rows.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => {
        let val = row[i];
        // Convert numbers where possible
        if (!isNaN(parseFloat(val)) && isFinite(val)) val = Number(val);
        obj[h] = val;
      });
      return obj;
    });
  } catch (err) {
    console.error('Google Sheets Read Error:', err);
    alert('Could not load data: ' + err.message);
    return [];
  }
}

async function gsSave(tabName, objects, headers) {
  try {
    // Convert objects back to sheet rows
    const rows = [headers];
    objects.forEach(obj => {
      rows.push(headers.map(h => obj[h] ?? ''));
    });
    
    const res = await fetch(`${GS_WEB_APP_URL}?action=save`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tab: tabName, data: rows })
    });
    
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    return true;
  } catch (err) {
    console.error('Google Sheets Save Error:', err);
    alert('Could not save data: ' + err.message);
    return false;
  }
}
</script>

<body>

  <div class="page-header">
    <h1>↩️ Customer Returns</h1>
    <p>Record and manage product returns from customers</p>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search by customer or product..." oninput="renderReturns()">
    <button class="btn btn-primary" onclick="openModal()">➕ New Return</button>
  </div>

  <!-- Return List -->
  <div id="returnList"></div>

  <!-- Add Return Modal -->
  <div class="modal-overlay" id="returnModal">
    <div class="modal">
      <h3>Record Product Return</h3>
      <form id="returnForm">
        <div class="form-group">
          <label>Customer Name *</label>
          <input type="text" id="custName" required placeholder="Enter customer name">
        </div>
        
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="custPhone" placeholder="Customer contact number">
        </div>
        
        <div class="form-group">
          <label>Product Name / Item Returned *</label>
          <input type="text" id="productName" required placeholder="Name of the product">
        </div>
        
        <div class="form-row" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="returnQty" min="1" value="1" required>
          </div>
          <div class="form-group">
            <label>Refund Amount (LKR)</label>
            <input type="number" id="refundAmount" step="0.01" min="0" placeholder="0.00">
          </div>
        </div>
        
        <div class="form-group">
          <label>Reason for Return *</label>
          <select id="returnReason" required>
            <option value="">Select reason...</option>
            <option value="Defective / Faulty">Defective / Faulty</option>
            <option value="Wrong Item Delivered">Wrong Item Delivered</option>
            <option value="Not as Described">Not as Described</option>
            <option value="Changed Mind">Changed Mind</option>
            <option value="Warranty Claim">Warranty Claim</option>
            <option value="Other">Other</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Additional Notes</label>
          <textarea id="returnNotes" placeholder="Condition, details, etc."></textarea>
        </div>
        
        <div class="form-group">
          <label>Status</label>
          <select id="returnStatus">
            <option value="pending" selected>Pending</option>
            <option value="refunded">Refunded</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
        
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Return</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let returns = [];
    
    function loadReturns() {
      returns = JSON.parse(localStorage.getItem('shopReturns') || '[]');
      renderReturns();
    }
    
    function renderReturns() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('returnList');
      
      let filtered = returns;
      if (search) {
        filtered = returns.filter(r => 
          r.customerName.toLowerCase().includes(search) ||
          r.productName.toLowerCase().includes(search) ||
          r.reason.toLowerCase().includes(search)
        );
      }
      
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p style="font-size:40px; margin-bottom:10px;">↩️</p>
            <p>${returns.length === 0 ? 'No returns recorded yet.' : 'No matching returns found.'}</p>
            <p style="font-size:13px; margin-top:5px;">Click "New Return" to record your first return</p>
          </div>`;
        return;
      }
      
      // Sort: newest first
      filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
      
      container.innerHTML = filtered.map(r => {
        const statusClass = r.status === 'refunded' ? 'status-refunded' :
                            r.status === 'rejected' ? 'status-rejected' : 'status-pending';
        return `
          <div class="return-card">
            <div class="return-header">
              <div>
                <div class="cust-name">${escapeHtml(r.customerName)}</div>
                <div class="return-date">📅 ${r.date} — ${r.time}</div>
              </div>
              <span class="status-badge ${statusClass}">${r.status.charAt(0).toUpperCase() + r.status.slice(1)}</span>
            </div>
            <div class="return-details">
              <div><strong>Item:</strong> ${escapeHtml(r.productName)}</div>
              <div><strong>Qty:</strong> ${r.quantity}</div>
              ${r.refundAmount ? `<div class="refund-amount">Refund: LKR ${r.refundAmount.toLocaleString()}</div>` : ''}
              <div class="reason-box"><strong>Reason:</strong> ${escapeHtml(r.reason)}</div>
              ${r.notes ? `<div style="margin-top:6px; font-size:13px; color:#616161;"><strong>Notes:</strong> ${escapeHtml(r.notes)}</div>` : ''}
            </div>
            <div style="display:flex; gap:6px; justify-content:flex-end; margin-top:8px;">
              <button class="btn btn-secondary btn-sm" onclick="editReturn('${r.id}')">✏️ Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteReturn('${r.id}')">🗑️ Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }
    
    function openModal() {
      document.getElementById('returnForm').reset();
      document.getElementById('returnStatus').value = 'pending';
      document.getElementById('returnModal').classList.add('show');
    }
    
    function closeModal() {
      document.getElementById('returnModal').classList.remove('show');
    }
    
    function editReturn(id) {
      const r = returns.find(x => x.id === id);
      if (!r) return;
      
      document.getElementById('custName').value = r.customerName;
      document.getElementById('custPhone').value = r.customerPhone || '';
      document.getElementById('productName').value = r.productName;
      document.getElementById('returnQty').value = r.quantity;
      document.getElementById('refundAmount').value = r.refundAmount || '';
      document.getElementById('returnReason').value = r.reason;
      document.getElementById('returnNotes').value = r.notes || '';
      document.getElementById('returnStatus').value = r.status;
      document.getElementById('returnModal').classList.add('show');
      // Store editing ID temporarily
      document.getElementById('returnForm').dataset.editId = id;
    }
    
    function deleteReturn(id) {
      if (!confirm('Delete this return record?')) return;
      returns = returns.filter(r => r.id !== id);
      localStorage.setItem('shopReturns', JSON.stringify(returns));
      renderReturns();
    }
    
    document.getElementById('returnForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const editId = this.dataset.editId;
      const today = new Date();
      const dateStr = today.toLocaleDateString();
      const timeStr = today.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      
      const returnData = {
        id: editId || 'RET-' + Date.now(),
        customerName: document.getElementById('custName').value.trim(),
        customerPhone: document.getElementById('custPhone').value.trim(),
        productName: document.getElementById('productName').value.trim(),
        quantity: parseInt(document.getElementById('returnQty').value) || 1,
        refundAmount: parseFloat(document.getElementById('refundAmount').value) || 0,
        reason: document.getElementById('returnReason').value,
        notes: document.getElementById('returnNotes').value.trim(),
        status: document.getElementById('returnStatus').value,
        date: editId ? returns.find(r=>r.id===editId).date : dateStr,
        time: editId ? returns.find(r=>r.id===editId).time : timeStr,
        updatedAt: dateStr + ' ' + timeStr
      };
      
      if (editId) {
        const idx = returns.findIndex(r => r.id === editId);
        if (idx !== -1) returnss[idx] = returnData;
        delete this.dataset.editId;
      } else {
        returns.unshift(returnData);
      }
      
      localStorage.setItem('shopReturns', JSON.stringify(returns));
      closeModal();
      renderReturns();
      alert('✅ Return saved successfully!');
    });
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }
    
    loadReturns();
  </script>
</body>
