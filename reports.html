  <script>
// ==========================================
// Google Sheets Sync — SOLO LAB MOBILES
// ==========================================
const GS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwdVCmtSvSo5deT_5Os6yXRp1EE7hroItOe6ufemZe-rgH-yzsM9xq02bLqWsSUjBPw/exec"; // ← PASTE YOUR URL HERE

async function gsRead(tabName) {
  try {
    const res = await fetch(`${GS_WEB_APP_URL}?action=read&tab=${tabName}`);
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    
    // Convert sheet rows to objects (first row = headers)
    const rows = json.data;
    if (rows.length < 2) return [];
    
    const headers = rows[0].map(h => h.trim());
    return rows.slice(1).map(row => {
      const obj = {};
      headers.forEach((h, i) => {
        let val = row[i];
        // Convert numbers where possible
        if (!isNaN(parseFloat(val)) && isFinite(val)) val = Number(val);
        obj[h] = val;
      });
      return obj;
    });
  } catch (err) {
    console.error('Google Sheets Read Error:', err);
    alert('Could not load data: ' + err.message);
    return [];
  }
}

async function gsSave(tabName, objects, headers) {
  try {
    // Convert objects back to sheet rows
    const rows = [headers];
    objects.forEach(obj => {
      rows.push(headers.map(h => obj[h] ?? ''));
    });
    
    const res = await fetch(`${GS_WEB_APP_URL}?action=save`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tab: tabName, data: rows })
    });
    
    const json = await res.json();
    if (!json.success) throw new Error(json.error);
    return true;
  } catch (err) {
    console.error('Google Sheets Save Error:', err);
    alert('Could not save data: ' + err.message);
    return false;
  }
}
</script>

  <script>
    function loadReport(){
      // Try both possible storage keys for compatibility
      const sales = JSON.parse(localStorage.getItem('salesHistory') || localStorage.getItem('shopSales') || '[]');
      const products = JSON.parse(localStorage.getItem('shopProducts') || '[]');
      let html = '';

      // ========== DAILY SUMMARY ==========
      html += `
        <div class="section-header">
          <img src="shop-logo.png" alt="" class="section-logo">
          <h3 class="section-title">📅 Daily Sales Summary</h3>
        </div>
      `;
      if (sales.length === 0) {
        html += '<p class="empty">No sales data available yet.</p>';
      } else {
        const daily = {};
        sales.forEach(sale => {
          const date = sale.date ? sale.date.split(' ')[0] : (sale.timestamp ? sale.timestamp.split('T')[0] : 'Unknown');
          if (!daily[date]) daily[date] = { count:0, total:0, cash:0, card:0 };
          daily[date].count++;
          const amt = sale.grandTotal || sale.total || 0;
          daily[date].total += amt;
          const pm = (sale.paymentMethod || '').toLowerCase();
          if (pm.indexOf('cash') > -1) daily[date].cash += amt;
          if (pm.indexOf('card') > -1) daily[date].card += amt;
        });

        html += '<table><tr><th>Date</th><th>Transactions</th><th>Cash</th><th>Card</th><th>Total Sales</th></tr>';
        for (let d in daily) {
          html += `<tr>
            <td>${d}</td>
            <td>${daily[d].count}</td>
            <td>Rs. ${daily[d].cash.toFixed(2)}</td>
            <td>Rs. ${daily[d].card.toFixed(2)}</td>
            <td><strong>Rs. ${daily[d].total.toFixed(2)}</strong></td>
          </tr>`;
        }
        html += '</table>';
      }

      // ========== MONTHLY SUMMARY ==========
      html += `
        <div class="section-header">
          <img src="shop-logo.png" alt="" class="section-logo">
          <h3 class="section-title">📆 Monthly Sales Summary</h3>
        </div>
      `;
      if (sales.length === 0) {
        html += '<p class="empty">No sales data available yet.</p>';
      } else {
        const monthly = {};
        sales.forEach(sale => {
          const date = sale.date ? sale.date.split(' ')[0] : (sale.timestamp ? sale.timestamp.split('T')[0] : 'Unknown');
          const month = date.substring(0, 7);
          if (!monthly[month]) monthly[month] = { count:0, total:0 };
          monthly[month].count++;
          monthly[month].total += sale.grandTotal || sale.total || 0;
        });

        html += '<table><tr><th>Month</th><th>Transactions</th><th>Total Sales</th></tr>';
        for (let m in monthly) {
          html += `<tr>
            <td>${m}</td>
            <td>${monthly[m].count}</td>
            <td><strong>Rs. ${monthly[m].total.toFixed(2)}</strong></td>
          </tr>`;
        }
        html += '</table>';
      }

      // ========== PRODUCT COMPARISON ==========
      html += `
        <div class="section-header">
          <img src="shop-logo.png" alt="" class="section-logo">
          <h3 class="section-title">📦 Stock & Product Comparison</h3>
        </div>
      `;
      if (products.length === 0) {
        html += '<p class="empty">No product data available. Save products to see stock report.</p>';
      } else {
        html += '<table><tr><th>Code</th><th>Product Name</th><th>Category</th><th>Stock</th><th>Status</th></tr>';
        products.forEach(p => {
          const status = p.stock <= 3
            ? '<span style="color:#dc2626">⚠️ Low Stock</span>'
            : '<span style="color:#16a34a">✅ In Stock</span>';
          html += `<tr>
            <td>${p.code || '-'}</td>
            <td>${p.name}</td>
            <td>${p.category || '-'}</td>
            <td>${p.stock}</td>
            <td>${status}</td>
          </tr>`;
        });
        html += '</table>';
        html += `<p style="text-align:right; font-weight:bold; margin-top:10px;">Total Products: ${products.length} | Low Stock Items: ${products.filter(p => p.stock <= 3).length}</p>`;
      }

      document.getElementById('reportOutput').innerHTML = html;
    }

    window.onload = loadReport;
  </script>
